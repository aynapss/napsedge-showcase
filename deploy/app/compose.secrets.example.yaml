# Phase 9 decision 9 (approved 2026-10-09): PREPARED, NOT ACTIVE -- the server overlay for compose.yaml that hands each process
# ONLY its own secrets as read-only files (decrypted into RAM by napsedge-app-secrets.service.example), instead of environment
# values. Use:  docker compose -f compose.yaml -f deploy/app/compose.secrets.example.yaml up -d
# The plain variables must be EMPTY on the server (each `<NAME>` and `<NAME>_FILE` pair accepts exactly one source), and
# NAPSEDGE_DATABASE_URL must carry no password (the app inserts it from NAPSEDGE_DATABASE_PASSWORD_FILE).
# Separation kept from 9A: the API never receives the Discord token; Discord never receives the API key hashes; Streamlit neither.
secrets:
  db-password:
    file: /run/napsedge-app-secrets/db-password
  api-key-hashes:
    file: /run/napsedge-app-secrets/api-key-hashes
  discord-bot-token:
    file: /run/napsedge-app-secrets/discord-bot-token

services:
  api:
    secrets: [db-password, api-key-hashes]
    environment:
      NAPSEDGE_DATABASE_PASSWORD_FILE: /run/secrets/db-password
      NAPSEDGE_API_KEY_HASHES_JSON_FILE: /run/secrets/api-key-hashes
  streamlit:
    secrets: [db-password]
    environment:
      NAPSEDGE_DATABASE_PASSWORD_FILE: /run/secrets/db-password
  discord:
    secrets: [db-password, discord-bot-token]
    environment:
      NAPSEDGE_DATABASE_PASSWORD_FILE: /run/secrets/db-password
      DISCORD_BOT_TOKEN_FILE: /run/secrets/discord-bot-token
