[pytest]
testpaths = tests
python_files = test_*.py
markers =
    unit: fast, no I/O beyond the module under test
    regression: locks in behavior verified against the notebook, no network
    integration: exercises multiple src modules together, no network
    live: hits a real external network endpoint (deselected by default)
    slow: takes noticeably longer than the rest of the suite
    postgres: exercises a real, disposable PostgreSQL instance via Docker (deselected by default; requires a running Docker daemon)
    redis: exercises a real, disposable Redis via Docker (Phase 9D shared rate limit; deselected by default)
addopts = -m "not live and not postgres and not redis"
