[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# sqlalchemy.url is intentionally left unset here -- src/db/config.py's
# get_database_url() (via alembic/env.py) is the single source of truth
# for the connection string, resolved from NAPSEDGE_DATABASE_URL at
# migration-run time. Never hardcode a real connection string in this
# file (Phase 5A: "store no credentials or sensitive configuration
# values").

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
